name: Web Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm install

    - name: Typecheck
      run: npm run lint

    - name: Build Web App
      run: npm run build

    - name: Upload Web Build
      uses: actions/upload-artifact@v4
      with:
        name: web-dist
        path: dist/
