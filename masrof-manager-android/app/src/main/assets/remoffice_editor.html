<!DOCTYPE html>
<html lang="ar" dir="auto">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=4.0, user-scalable=yes" />
<title>REMOOFFICE محرر</title>
<style>
  /* Local bundled fonts: no external network requests */
  @font-face {
    font-family: 'REMOO Noto Sans Arabic';
    src: url('fonts/NotoSansArabic-VF.ttf') format('truetype');
    font-style: normal;
    font-weight: 100 900;
    font-display: block;
  }
  @font-face {
    font-family: 'Noto Sans Arabic';
    src: url('fonts/NotoSansArabic-VF.ttf') format('truetype');
    font-style: normal;
    font-weight: 100 900;
    font-display: block;
  }
  @font-face {
    font-family: 'REMOO Noto Sans';
    src: url('fonts/NotoSans-VF.ttf') format('truetype');
    font-style: normal;
    font-weight: 100 900;
    font-display: block;
  }
  @font-face {
    font-family: 'Noto Sans';
    src: url('fonts/NotoSans-VF.ttf') format('truetype');
    font-style: normal;
    font-weight: 100 900;
    font-display: block;
  }
  @font-face {
    font-family: 'REMOO Noto Serif';
    src: url('fonts/NotoSerif-VF.ttf') format('truetype');
    font-style: normal;
    font-weight: 100 900;
    font-display: block;
  }
  @font-face {
    font-family: 'Noto Serif';
    src: url('fonts/NotoSerif-VF.ttf') format('truetype');
    font-style: normal;
    font-weight: 100 900;
    font-display: block;
  }
  @font-face { font-family: 'Cairo'; src: url('fonts/cairo_regular.ttf') format('truetype'); font-weight: 400; font-style: normal; font-display: block; }
  @font-face { font-family: 'Cairo'; src: url('fonts/cairo_bold.ttf') format('truetype'); font-weight: 700; font-style: normal; font-display: block; }
  @font-face { font-family: 'Amiri'; src: url('fonts/amiri_regular.ttf') format('truetype'); font-weight: 400; font-style: normal; font-display: block; }
  @font-face { font-family: 'Amiri'; src: url('fonts/amiri_bold.ttf') format('truetype'); font-weight: 700; font-style: normal; font-display: block; }
  @font-face { font-family: 'Tajawal'; src: url('fonts/tajawal_regular.ttf') format('truetype'); font-weight: 400; font-style: normal; font-display: block; }
  @font-face { font-family: 'Tajawal'; src: url('fonts/tajawal_bold.ttf') format('truetype'); font-weight: 700; font-style: normal; font-display: block; }
  @font-face { font-family: 'Noto Naskh Arabic'; src: url('fonts/noto_naskh_regular.ttf') format('truetype'); font-weight: 400; font-style: normal; font-display: block; }
  @font-face { font-family: 'Noto Naskh Arabic'; src: url('fonts/noto_naskh_bold.ttf') format('truetype'); font-weight: 700; font-style: normal; font-display: block; }
  @font-face { font-family: 'Scheherazade New'; src: url('fonts/scheherazade_regular.ttf') format('truetype'); font-weight: 400; font-style: normal; font-display: block; }
  @font-face { font-family: 'Scheherazade New'; src: url('fonts/scheherazade_bold.ttf') format('truetype'); font-weight: 700; font-style: normal; font-display: block; }
  @font-face { font-family: 'El Messiri'; src: url('fonts/el_messiri_regular.ttf') format('truetype'); font-weight: 400; font-style: normal; font-display: block; }
  @font-face { font-family: 'El Messiri'; src: url('fonts/el_messiri_bold.ttf') format('truetype'); font-weight: 700; font-style: normal; font-display: block; }
  @font-face { font-family: 'Noto Kufi Arabic'; src: url('fonts/noto_kufi_regular.ttf') format('truetype'); font-weight: 400; font-style: normal; font-display: block; }
  @font-face { font-family: 'Noto Kufi Arabic'; src: url('fonts/noto_kufi_bold.ttf') format('truetype'); font-weight: 700; font-style: normal; font-display: block; }

  :root {
    --page-width: 210mm;
    --page-min-height: 297mm;
    --page-margin-top: 25.4mm;
    --page-margin-right: 25.4mm;
    --page-margin-bottom: 25.4mm;
    --page-margin-left: 25.4mm;
    --page-columns: 1;
    --page-bg: #FFFFFF;
    --page-text: #1E293B;
    --zoom-scale: 1;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    background-color: #E8ECF2;
    font-family: 'REMOO Noto Sans Arabic', 'Noto Sans Arabic', 'REMOO Noto Sans', 'Noto Sans', 'Cairo', 'Arial', 'Tahoma', sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  .workspace {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px 12px 64px 12px;
    min-height: 100vh;
    transform: scale(var(--zoom-scale));
    transform-origin: top center;
  }

  .page-container {
    width: 100%;
    max-width: var(--page-width);
    min-height: var(--page-min-height);
    background-color: var(--page-bg);
    color: var(--page-text);
    box-shadow: 0 4px 20px rgba(15, 23, 42, 0.12), 0 1px 4px rgba(15, 23, 42, 0.08);
    border-radius: 3px;
    padding: var(--page-margin-top) var(--page-margin-right) var(--page-margin-bottom) var(--page-margin-left);
    display: flex;
    flex-direction: column;
    transition: padding 0.2s ease, max-width 0.2s ease, background-color 0.2s ease;
  }

  .page-header, .page-footer {
    font-size: 10pt;
    color: #64748B;
    border-bottom: 1px dashed #CBD5E1;
    padding-bottom: 6px;
    margin-bottom: 12px;
    outline: none;
    min-height: 20px;
  }

  .page-footer {
    border-bottom: none;
    border-top: 1px dashed #CBD5E1;
    padding-bottom: 0;
    padding-top: 6px;
    margin-top: auto;
    margin-bottom: 0;
  }

  .page-header:empty::before {
    content: "انقر لإضافة رأس الصفحة (Header)...";
    color: #94A3B8;
  }

  .page-footer:empty::before {
    content: "انقر لإضافة تذييل الصفحة (Footer)...";
    color: #94A3B8;
  }

  .page {
    flex: 1;
    outline: none;
    font-size: 14pt;
    line-height: 1.5;
    word-wrap: break-word;
    overflow-wrap: break-word;
    column-count: var(--page-columns);
    column-gap: 24px;
  }

  .page-container.read-mode {
    box-shadow: none;
  }

  .page-container.read-mode .page-header:empty,
  .page-container.read-mode .page-footer:empty {
    display: none;
  }

  .page p {
    margin: 0 0 8pt 0;
  }

  .page h1 { font-size: 22pt; margin: 12pt 0 6pt 0; color: #0F172A; }
  .page h2 { font-size: 18pt; margin: 10pt 0 5pt 0; color: #1E293B; }
  .page h3 { font-size: 15pt; margin: 8pt 0 4pt 0; color: #334155; }
  .page blockquote {
    border-inline-start: 4px solid #1A56DB;
    margin: 8pt 0;
    padding: 6pt 12pt;
    background: rgba(26, 86, 219, 0.05);
    color: #475569;
  }

  .page hr {
    border: none;
    border-top: 1.5px solid #CBD5E1;
    margin: 12pt 0;
  }

  .page table {
    width: 100%;
    border-collapse: collapse;
    margin: 10px 0;
    table-layout: fixed;
  }

  .page td, .page th {
    border: 1px solid #94A3B8;
    padding: 6px 8px;
    min-width: 24px;
    vertical-align: top;
    word-break: break-word;
  }

  .page td.selected-cell {
    outline: 2px solid #1A56DB;
  }

  .page img {
    max-width: 100%;
    height: auto;
    border-radius: 4px;
    margin: 6px 0;
    display: inline-block;
    cursor: pointer;
  }

  .page img.selected-img {
    outline: 2.5px solid #1A56DB;
    outline-offset: 2px;
  }

  .page a {
    color: #1A56DB;
    text-decoration: underline;
  }

  .page-break {
    border-top: 2px dashed #94A3B8;
    margin: 18px 0;
    padding-top: 4px;
    text-align: center;
    font-size: 10pt;
    color: #64748B;
    user-select: none;
    page-break-after: always;
    break-after: page;
  }

  .page-break::after {
    content: "— فاصل صفحة / Page Break —";
  }

  .page-number {
    display: inline-block;
    padding: 1px 6px;
    background: #F1F5F9;
    border-radius: 4px;
    font-size: 11pt;
    color: #475569;
  }

  .text-box {
    border: 1.5px solid #1A56DB;
    background-color: #F8FAFC;
    padding: 10px 14px;
    margin: 10px 0;
    border-radius: 6px;
    min-height: 44px;
  }

  .shape-block {
    margin: 10px 0;
    display: inline-block;
  }

  ins.remoffice-insert {
    background-color: #DCFCE7;
    color: #166534;
    text-decoration: underline;
    padding: 1px 3px;
    border-radius: 2px;
  }

  del.remoffice-delete {
    background-color: #FEE2E2;
    color: #991B1B;
    text-decoration: line-through;
    padding: 1px 3px;
    border-radius: 2px;
  }

  mark.remoffice-comment-anchor {
    background-color: #FEF08A;
    border-bottom: 2px solid #D97706;
    padding: 1px 3px;
    cursor: pointer;
    border-radius: 2px;
  }

  mark.remoffice-comment-anchor.resolved {
    background-color: #E2E8F0;
    border-bottom-color: #94A3B8;
  }

  sup.remoffice-note-reference {
    color: #1A56DB;
    font-weight: bold;
    cursor: pointer;
    padding: 0 2px;
  }

  span.remoffice-bookmark {
    border-inline-start: 3px solid #7C3AED;
    margin: 0 2px;
    display: inline-block;
    width: 0;
    height: 1em;
    vertical-align: middle;
  }

  .remoffice-footnotes, .remoffice-endnotes {
    margin-top: 24px;
    border-top: 1px dashed #CBD5E1;
    padding-top: 12px;
    font-size: 10pt;
    color: #475569;
  }

  .remoffice-note-item {
    margin: 4px 0;
  }

  .remoffice-toc-box {
    border: 1px solid #CBD5E1;
    background: #F8FAFC;
    padding: 12px 16px;
    border-radius: 8px;
    margin: 12px 0;
  }

  @media print {
    html, body { background: #FFFFFF; }
    .workspace { padding: 0; transform: none; }
    .page-container { box-shadow: none; max-width: 100%; border-radius: 0; }
    .page-header:empty, .page-footer:empty { display: none; }
    .page-break { border: none; margin: 0; padding: 0; }
    .page-break::after { content: ""; }
  }
</style>
</head>
<body>
<div class="workspace">
  <div id="pageContainer" class="page-container">
    <div id="pageHeader" class="page-header" contenteditable="true"></div>
    <div id="editor" class="page" contenteditable="true" spellcheck="true">
      <p>مرحباً بك في <b>REMOOFFICE محرر</b> — محرر المستندات الاحترافي المتكامل.</p>
      <p>ابدأ الكتابة هنا أو استخدم شريط الأدوات بالأسفل لتنسيق النصوص، إدراج الجداول، الصور، وتخطيط الصفحة.</p>
    </div>
    <section id="remofficeFootnotes" class="remoffice-footnotes" style="display:none;">
      <b>الحواشي السفلية / Footnotes:</b>
    </section>
    <section id="remofficeEndnotes" class="remoffice-endnotes" style="display:none;">
      <b>الحواشي الختامية / Endnotes:</b>
    </section>
    <div id="pageFooter" class="page-footer" contenteditable="true"></div>
  </div>
</div>

<script>
(function() {
  const editor = document.getElementById('editor');
  const pageContainer = document.getElementById('pageContainer');
  let currentFontSizePt = 14;
  let currentLineHeight = '1.5';
  let lastSelectedCell = null;
  let lastSelectedImage = null;
  let copiedFormat = null;

  let suppressTracking = false;
  let trackChangesEnabled = false;
  let trackedChangeIndex = -1;

  function focusEditor() {
    if (editor.getAttribute('contenteditable') === 'true') {
      editor.focus();
    }
  }

  function getClosestTag(node, tagName) {
    while (node && node !== editor) {
      if (node.nodeType === 1 && node.tagName.toLowerCase() === tagName.toLowerCase()) {
        return node;
      }
      node = node.parentNode;
    }
    return null;
  }

  function rgbToHex(rgb) {
    if (!rgb || rgb === 'transparent' || rgb === 'rgba(0, 0, 0, 0)') return '';
    if (rgb.startsWith('#')) return rgb.toUpperCase();
    const match = rgb.match(/\d+/g);
    if (!match || match.length < 3) return '';
    return '#' + match.slice(0, 3).map(x => {
      const hex = parseInt(x, 10).toString(16);
      return hex.length === 1 ? '0' + hex : hex;
    }).join('').toUpperCase();
  }

  function computeStats() {
    const text = (editor.innerText || '').trim();
    const words = text.length === 0 ? 0 : text.split(/\s+/).filter(Boolean).length;
    const chars = text.length;
    const paragraphs = editor.querySelectorAll('p, h1, h2, h3, h4, h5, h6, li, blockquote').length || (text.length > 0 ? 1 : 0);
    const breaks = editor.querySelectorAll('.page-break').length;
    const heightPages = Math.max(1, Math.ceil(editor.scrollHeight / 1050));
    const pageCount = Math.max(breaks + 1, heightPages);
    return { words, chars, paragraphs, pageCount };
  }

  let lastValidSelectionRange = null;

  function notifySelectionState() {
    try {
      const sel = window.getSelection();
      let anchorNode = sel && sel.rangeCount > 0 ? sel.getRangeAt(0).startContainer : null;
      const cell = getClosestTag(anchorNode, 'td') || getClosestTag(anchorNode, 'th');
      if (lastSelectedCell && lastSelectedCell !== cell) {
        lastSelectedCell.classList.remove('selected-cell');
      }
      if (cell) {
        cell.classList.add('selected-cell');
      }
      lastSelectedCell = cell;

      if (sel && sel.rangeCount > 0 && !sel.isCollapsed && sel.toString().trim().length > 0) {
        lastValidSelectionRange = sel.getRangeAt(0).cloneRange();
      }

      let alignment = 'left';
      if (document.queryCommandState('justifyCenter')) alignment = 'center';
      else if (document.queryCommandState('justifyRight')) alignment = 'right';
      else if (document.queryCommandState('justifyFull')) alignment = 'justify';

      const stats = computeStats();
      const state = {
        isBold: document.queryCommandState('bold'),
        isItalic: document.queryCommandState('italic'),
        isUnderline: document.queryCommandState('underline'),
        isStrikethrough: document.queryCommandState('strikeThrough'),
        isSuperscript: document.queryCommandState('superscript'),
        isSubscript: document.queryCommandState('subscript'),
        fontName: (document.queryCommandValue('fontName') || 'Arial').replace(/['"]/g, ''),
        fontSize: currentFontSizePt,
        foreColor: rgbToHex(document.queryCommandValue('foreColor')) || '#1E293B',
        backColor: rgbToHex(document.queryCommandValue('backColor')) || '',
        alignment: alignment,
        lineHeight: currentLineHeight,
        isBulletList: document.queryCommandState('insertUnorderedList'),
        isNumberList: document.queryCommandState('insertOrderedList'),
        inTable: Boolean(cell),
        inImage: Boolean(lastSelectedImage),
        formatPainterActive: Boolean(copiedFormat),
        wordCount: stats.words,
        charCount: stats.chars,
        paragraphCount: stats.paragraphs,
        pageCount: stats.pageCount,
        selectedText: sel ? sel.toString().trim() : ''
      };

      if (window.AndroidBridge && window.AndroidBridge.onSelectionChanged) {
        window.AndroidBridge.onSelectionChanged(JSON.stringify(state));
      }
    } catch (e) {}
  }

  function notifyContentChanged() {
    if (suppressTracking) return;
    if (window.AndroidBridge && window.AndroidBridge.onContentChanged) {
      const payload = JSON.stringify({
        bodyHtml: editor.innerHTML,
        headerHtml: document.getElementById('pageHeader').innerHTML,
        footerHtml: document.getElementById('pageFooter').innerHTML
      });
      window.AndroidBridge.onContentChanged(payload);
    }
  }

  // Keep long imported or newly typed documents paginated in the editing canvas.
  // A page break is inserted only when the content exceeds another A4-height block;
  // explicit/manual page breaks are never removed or rewritten.
  let paginationScheduled = false;
  function ensureAutomaticPageBreaks() {
    if (paginationScheduled) return;
    paginationScheduled = true;
    requestAnimationFrame(function() {
      paginationScheduled = false;
      if (!editor || editor.getAttribute('contenteditable') !== 'true') return;
      const pageHeight = 1050;
      const desiredBreaks = Math.max(0, Math.ceil(editor.scrollHeight / pageHeight) - 1);
      const automaticBreaks = editor.querySelectorAll('.page-break[data-auto-page-break="true"]').length;
      let missing = desiredBreaks - automaticBreaks;
      while (missing > 0) {
        const last = editor.lastElementChild;
        if (!last || last.classList.contains('page-break')) break;
        const breakElement = document.createElement('div');
        breakElement.className = 'page-break';
        breakElement.setAttribute('data-auto-page-break', 'true');
        breakElement.setAttribute('contenteditable', 'false');
        const nextPage = document.createElement('p');
        nextPage.innerHTML = '<br>';
        editor.insertBefore(breakElement, last);
        editor.insertBefore(nextPage, last);
        missing -= 1;
      }
      if (desiredBreaks > automaticBreaks) {
        ensureElementIds();
        notifyContentChanged();
        notifySelectionState();
      }
    });
  }

  document.addEventListener('selectionchange', notifySelectionState);
  editor.addEventListener('click', function(e) {
    if (lastSelectedImage && lastSelectedImage !== e.target) {
      lastSelectedImage.classList.remove('selected-img');
      lastSelectedImage = null;
    }
    if (e.target && e.target.tagName && e.target.tagName.toLowerCase() === 'img') {
      lastSelectedImage = e.target;
      lastSelectedImage.classList.add('selected-img');
    }
    notifySelectionState();
  });
  editor.addEventListener('keyup', notifySelectionState);
  editor.addEventListener('mouseup', function() {
    if (copiedFormat) {
      applyCopiedFormat();
    }
    notifySelectionState();
  });
  editor.addEventListener('input', function() {
    ensureAutomaticPageBreaks();
    notifySelectionState();
    notifyContentChanged();
  });
  document.getElementById('pageHeader').addEventListener('input', notifyContentChanged);
  document.getElementById('pageFooter').addEventListener('input', notifyContentChanged);

  // --- Real-time Track Changes Observer ---
  editor.addEventListener('beforeinput', function(e) {
    if (!trackChangesEnabled || suppressTracking) return;

    const inputType = e.inputType;
    const sel = window.getSelection();
    if (!sel || sel.rangeCount === 0) return;
    const range = sel.getRangeAt(0);

    if (inputType === 'insertText' || inputType === 'insertCompositionText' || inputType === 'insertFromPaste') {
      const textToInsert = e.data || (e.clipboardData ? e.clipboardData.getData('text/plain') : '');
      if (!textToInsert) return;

      e.preventDefault();
      const changeId = 'tc_' + Date.now() + '_' + Math.floor(Math.random() * 10000);
      const anchor = getCurrentSelectionAnchor();

      suppressTracking = true;
      range.deleteContents();

      const ins = document.createElement('ins');
      ins.setAttribute('data-remoffice-change-id', changeId);
      ins.className = 'remoffice-insert';
      ins.textContent = textToInsert;

      range.insertNode(ins);

      const newRange = document.createRange();
      newRange.setStartAfter(ins);
      newRange.setEndAfter(ins);
      sel.removeAllRanges();
      sel.addRange(newRange);

      suppressTracking = false;

      const changeObj = {
        id: changeId,
        type: 'INSERT',
        elementId: anchor ? anchor.elementId : '',
        anchor: anchor,
        oldText: '',
        newText: textToInsert,
        oldHtml: '',
        newHtml: ins.outerHTML,
        author: 'المستخدم',
        timestamp: Date.now(),
        status: 'PENDING',
        createdByUser: true
      };
      if (window.AndroidBridge && window.AndroidBridge.onTrackedChange) {
        window.AndroidBridge.onTrackedChange(JSON.stringify(changeObj));
      }
      notifyContentChanged();
    } else if (inputType === 'deleteContentBackward' || inputType === 'deleteContentForward' || inputType === 'deleteByCut') {
      let deletedText = sel.toString();
      if (!deletedText && inputType === 'deleteContentBackward') {
        const cloneRange = range.cloneRange();
        if (cloneRange.startOffset > 0) {
          cloneRange.setStart(cloneRange.startContainer, cloneRange.startOffset - 1);
          deletedText = cloneRange.toString();
        }
      }
      if (!deletedText) return;

      e.preventDefault();
      const changeId = 'tc_' + Date.now() + '_' + Math.floor(Math.random() * 10000);
      const anchor = getCurrentSelectionAnchor();

      suppressTracking = true;
      if (sel.isCollapsed && inputType === 'deleteContentBackward') {
        const cloneRange = range.cloneRange();
        if (cloneRange.startOffset > 0) {
          cloneRange.setStart(cloneRange.startContainer, cloneRange.startOffset - 1);
          cloneRange.deleteContents();
        }
      } else {
        range.deleteContents();
      }

      const del = document.createElement('del');
      del.setAttribute('data-remoffice-change-id', changeId);
      del.className = 'remoffice-delete';
      del.textContent = deletedText;

      range.insertNode(del);

      const newRange = document.createRange();
      newRange.setStartAfter(del);
      newRange.setEndAfter(del);
      sel.removeAllRanges();
      sel.addRange(newRange);

      suppressTracking = false;

      const changeObj = {
        id: changeId,
        type: 'DELETE',
        elementId: anchor ? anchor.elementId : '',
        anchor: anchor,
        oldText: deletedText,
        newText: '',
        oldHtml: '',
        newHtml: del.outerHTML,
        author: 'المستخدم',
        timestamp: Date.now(),
        status: 'PENDING',
        createdByUser: true
      };
      if (window.AndroidBridge && window.AndroidBridge.onTrackedChange) {
        window.AndroidBridge.onTrackedChange(JSON.stringify(changeObj));
      }
      notifyContentChanged();
    }
  });

  function applyCopiedFormat() {
    if (!copiedFormat) return;
    const fmt = copiedFormat;
    copiedFormat = null;
    if (document.queryCommandState('bold') !== fmt.bold) document.execCommand('bold', false, null);
    if (document.queryCommandState('italic') !== fmt.italic) document.execCommand('italic', false, null);
    if (document.queryCommandState('underline') !== fmt.underline) document.execCommand('underline', false, null);
    if (fmt.foreColor) document.execCommand('foreColor', false, fmt.foreColor);
    if (fmt.fontName) document.execCommand('fontName', false, fmt.fontName);
    notifyContentChanged();
  }

  function exec(cmd, val = null) {
    focusEditor();
    document.execCommand(cmd, false, val);
    notifySelectionState();
    notifyContentChanged();
  }

  window.editorApi = {
    undo: () => exec('undo'),
    redo: () => exec('redo'),
    toggleBold: () => exec('bold'),
    toggleItalic: () => exec('italic'),
    toggleUnderline: () => exec('underline'),
    toggleStrikethrough: () => exec('strikeThrough'),
    toggleSuperscript: () => exec('superscript'),
    toggleSubscript: () => exec('subscript'),
    clearFormatting: () => exec('removeFormat'),

    toggleFormatPainter: () => {
      if (copiedFormat) {
        copiedFormat = null;
      } else {
        copiedFormat = {
          bold: document.queryCommandState('bold'),
          italic: document.queryCommandState('italic'),
          underline: document.queryCommandState('underline'),
          foreColor: document.queryCommandValue('foreColor'),
          fontName: document.queryCommandValue('fontName')
        };
      }
      notifySelectionState();
    },

    setHeading: (tag) => exec('formatBlock', tag),

    setDirection: (dir) => {

        const fontElements = editor.querySelectorAll('font[size="7"]');
        fontElements.forEach(el => {

    insertTable: (rows, cols) => {
      focusEditor();
      let html = '<table><tbody>';
      for (let r = 0; r < rows; r++) {
        html += '<tr>';
        for (let c = 0; c < cols; c++) {
          html += '<td><br></td>';

    addTableRow: () => {
      const sel = window.getSelection();
      const cell = getClosestTag(sel && sel.anchorNode, 'td') || lastSelectedCell;
      if (!cell) return;
      const row = cell.parentNode;
      const newRow = row.cloneNode(true);
      Array.from(newRow.cells).forEach(c => { c.innerHTML = '<br>'; c.classList.remove('selected-cell'); });
      row.parentNode.insertBefore(newRow, row.nextSibling);
      notifyContentChanged();
    },

    addTableCol: () => {
      const sel = window.getSelection();
      const cell = getClosestTag(sel && sel.anchorNode, 'td') || lastSelectedCell;
      if (!cell) return;
      const colIndex = cell.cellIndex;
      const table = getClosestTag(cell, 'table');
      if (!table) return;
      Array.from(table.rows).forEach(r => {
        const newCell = r.insertCell(colIndex + 1);
        newCell.innerHTML = '<br>';
      });
      notifyContentChanged();
    },

    deleteTableRow: () => {
      const sel = window.getSelection();
      const cell = getClosestTag(sel && sel.anchorNode, 'td') || lastSelectedCell;
      if (!cell) return;
      const row = cell.parentNode;
      const table = getClosestTag(row, 'table');
      if (table && table.rows.length > 1) {
        row.parentNode.removeChild(row);
      } else if (table) {
        table.parentNode.removeChild(table);
      }
      lastSelectedCell = null;
      notifySelectionState();
      notifyContentChanged();
    },

    deleteTableCol: () => {
      const sel = window.getSelection();
      const cell = getClosestTag(sel && sel.anchorNode, 'td') || lastSelectedCell;
      if (!cell) return;
      const colIndex = cell.cellIndex;
      const table = getClosestTag(cell, 'table');
      if (!table) return;
      if (table.rows[0].cells.length <= 1) {
        table.parentNode.removeChild(table);
      } else {
        Array.from(table.rows).forEach(r => {
          if (r.cells[colIndex]) r.deleteCell(colIndex);
        });
      }
      lastSelectedCell = null;
      notifySelectionState();
      notifyContentChanged();
    },

    mergeTableCells: () => {
      const sel = window.getSelection();
      const cell = getClosestTag(sel && sel.anchorNode, 'td') || lastSelectedCell;
      if (!cell) return;
      const nextCell = cell.nextElementSibling;
      if (nextCell) {
        cell.colSpan = (cell.colSpan || 1) + (nextCell.colSpan || 1);
        cell.innerHTML += ' ' + nextCell.innerHTML;
        nextCell.parentNode.removeChild(nextCell);
        notifyContentChanged();
      }
    },

    setCellBackground: (hex) => {
      const sel = window.getSelection();
      const cell = getClosestTag(sel && sel.anchorNode, 'td') || lastSelectedCell;
      if (cell) {
        cell.style.backgroundColor = hex;
        notifyContentChanged();
      }
    },

    insertImage: (dataUrl, widthPercent) => {

    resizeImage: (widthPercent) => {

    alignImage: (align) => {

    toggleImageBorder: () => {

    toggleImageRounded: () => {

        lastSelectedImage.style.borderRadius = '4px';

        lastSelectedImage.style.borderRadius = '50%';
      }
      notifyContentChanged();
    },

    deleteSelectedImage: () => {
      if (!lastSelectedImage) return;
      lastSelectedImage.parentNode.removeChild(lastSelectedImage);
      lastSelectedImage = null;
      notifySelectionState();
      notifyContentChanged();
    },

    insertShape: (shapeType) => {

        svg = '<svg width="160" height="90" viewBox="0 0 160 90"><rect x="4" y="4" width="152" height="82" rx="8" fill="#DBEAFE" stroke="#1A56DB" stroke-width="3"/></svg>';
      } else if (shapeType === 'circle') {

      } else if (shapeType === 'arrow') {
        svg = '<svg width="160" height="50" viewBox="0 0 160 50"><line x1="8" y1="25" x2="140" y2="25" stroke="#1A56DB" stroke-width="4"/><polygon points="140,15 156,25 140,35" fill="#1A56DB"/></svg>';
      } else if (shapeType === 'star') {
        svg = '<svg width="100" height="100" viewBox="0 0 100 100"><polygon points="50,5 63,35 95,38 71,59 78,91 50,74 22,91 29,59 5,38 37,35" fill="#FEF08A" stroke="#CA8A04" stroke-width="3"/></svg>';
      } else {
        svg = '<svg width="180" height="90" viewBox="0 0 180 90"><rect x="4" y="4" width="172" height="66" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2.5"/><polygon points="30,70 45,70 25,86" fill="#ECFDF5" stroke="#059669" stroke-width="2.5"/></svg>';

    insertTextBox: (text) => {
      focusEditor();
      const box = document.createElement('div');
      box.className = 'text-box';
      box.textContent = text || 'مربع نص قابل للتعديل — Editable Text Box';
      const spacer = document.createElement('p');
      spacer.innerHTML = '<br>';
      const selection = window.getSelection();
      const range = selection && selection.rangeCount > 0 ? selection.getRangeAt(0) : null;
      if (range) {
        range.deleteContents();
        range.insertNode(spacer);
        range.insertNode(box);
      } else {
        editor.appendChild(box);
        editor.appendChild(spacer);

      notifyContentChanged();
    },

    insertHyperlink: (url, text) => {
      focusEditor();
      const link = document.createElement('a');
      link.href = url;
      link.target = '_blank';
      link.rel = 'noopener noreferrer';
      link.textContent = text || url;
      const selection = window.getSelection();
      const range = selection && selection.rangeCount > 0 ? selection.getRangeAt(0) : null;
      if (range) {
        range.deleteContents();
        range.insertNode(link);
      } else {
        editor.appendChild(link);
      }
      notifyContentChanged();
    },

    insertPageBreak: () => {
      focusEditor();
      document.execCommand('insertHTML', false, '<div class="page-break" contenteditable="false"></div><p><br></p>');

    insertPageNumber: () => {

      document.execCommand('insertHTML', false, '<span class="page-number" contenteditable="false">1</span>&nbsp;');
      notifyContentChanged();
    },

    insertDateTime: () => {
      focusEditor();
      const now = new Date().toLocaleDateString('ar-EG', { year: 'numeric', month: 'long', day: 'numeric' });
      document.execCommand('insertHTML', false, `<span>${now}</span>&nbsp;`);
      notifyContentChanged();
    },

    insertHorizontalRule: () => {
      focusEditor();
      document.execCommand('insertHTML', false, '<hr><p><br></p>');
      notifyContentChanged();
    },

    setPageConfig: (size, orientation, marginPreset, customMarginMm, columns) => {
      const root = document.documentElement.style;
      const sizes = {
        A4: { w: 210, h: 297 },
        Letter: { w: 215.9, h: 279.4 },
        Legal: { w: 215.9, h: 355.6 },
        A5: { w: 148, h: 210 }
      };
      const s = sizes[size] || sizes.A4;
      const w = orientation === 'Landscape' ? s.h : s.w;
      const h = orientation === 'Landscape' ? s.w : s.h;
      root.setProperty('--page-width', w + 'mm');
      root.setProperty('--page-min-height', h + 'mm');

      let m = '25.4mm';
      if (marginPreset === 'Narrow') m = '12.7mm';
      else if (marginPreset === 'Wide') m = '38.1mm';
      else if (marginPreset === 'Custom') m = (customMarginMm || 20) + 'mm';

      root.setProperty('--page-margin-top', m);
      root.setProperty('--page-margin-right', m);
      root.setProperty('--page-margin-bottom', m);
      root.setProperty('--page-margin-left', m);
      root.setProperty('--page-columns', String(columns || 1));
    },

    setPageBackground: (bgHex, textHex) => {
      const root = document.documentElement.style;
      root.setProperty('--page-bg', bgHex || '#FFFFFF');
      root.setProperty('--page-text', textHex || '#1E293B');
    },

    setZoom: (scale) => {
      document.documentElement.style.setProperty('--zoom-scale', String(scale || 1));
    },

    findAndReplace: (findText, replaceText, replaceAll) => {
      if (!findText) return 0;
      const html = editor.innerHTML;
      const escaped = findText.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      const regex = new RegExp(escaped, replaceAll ? 'g' : '');
      const matches = html.match(new RegExp(escaped, 'g'));
      const count = matches ? matches.length : 0;
      if (count > 0) {
        editor.innerHTML = html.replace(regex, replaceText || '');
        notifySelectionState();
        notifyContentChanged();
      }
      return count;
    },

    // --- Anchors & Selection ---
    ensureElementIds: () => ensureElementIds(),
    getCurrentSelectionAnchor: () => getCurrentSelectionAnchor(),
    scrollToAnchor: (json) => scrollToAnchor(json),
    selectAnchor: (json) => selectAnchor(json),

    // --- Track Changes ---
    setTrackChangesEnabled: (enabled) => setTrackChangesEnabled(enabled),
    acceptTrackedChange: (id) => acceptTrackedChange(id),
    rejectTrackedChange: (id) => rejectTrackedChange(id),
    acceptAllTrackedChanges: () => acceptAllTrackedChanges(),
    rejectAllTrackedChanges: () => rejectAllTrackedChanges(),
    goToNextTrackedChange: () => goToNextTrackedChange(),
    goToPreviousTrackedChange: () => goToPreviousTrackedChange(),

    // --- Comment Anchors ---
    createCommentAnchor: (commentId) => createCommentAnchor(commentId),
    selectCommentAnchor: (commentId) => selectCommentAnchor(commentId),
    removeCommentAnchor: (commentId) => removeCommentAnchor(commentId),
    setCommentResolved: (commentId, resolved) => setCommentResolved(commentId, resolved),
    scrollToComment: (commentId) => selectCommentAnchor(commentId),

    // --- Styles ---
    applyStyle: (styleJson) => applyStyle(styleJson),
    updateStyle: (styleJson) => updateStyle(styleJson),

    // --- Footnotes & Endnotes ---
    insertFootnote: (noteJson) => insertFootnote(noteJson),
    insertEndnote: (noteJson) => insertEndnote(noteJson),
    deleteNote: (noteId) => deleteNote(noteId),
    renumberNotes: () => renumberNotes(),
    scrollToNote: (noteId) => scrollToNote(noteId),
    scrollToNoteReference: (noteId) => scrollToNoteReference(noteId),

    // --- Bookmarks & Internal Links ---
    addBookmark: (bookmarkJson) => addBookmark(bookmarkJson),
    renameBookmark: (id, newName) => renameBookmark(id, newName),
    deleteBookmark: (id) => deleteBookmark(id),
    goToBookmark: (id) => goToBookmark(id),
    insertInternalLink: (bookmarkId, text) => insertInternalLink(bookmarkId, text),

    // --- Table of Contents ---
    insertTableOfContents: () => insertTableOfContents(),
    updateTableOfContents: () => updateTableOfContents(),
    removeTableOfContents: () => removeTableOfContents(),
    goToHeading: (id) => goToHeading(id),

    setReadMode: (enabled) => {
      editor.setAttribute('contenteditable', enabled ? 'false' : 'true');
      document.getElementById('pageHeader').setAttribute('contenteditable', enabled ? 'false' : 'true');
      document.getElementById('pageFooter').setAttribute('contenteditable', enabled ? 'false' : 'true');
      if (enabled) {
        pageContainer.classList.add('read-mode');
      } else {
        pageContainer.classList.remove('read-mode');
      }
    },

    getHtml: () => editor.innerHTML,

    insertHtml: (html) => {
      focusEditor();
      document.execCommand('insertHTML', false, html);
      notifySelectionState();
      notifyContentChanged();
    },

    setDocumentPayload: (bodyHtml, headerHtml, footerHtml) => {
      suppressTracking = true;
      editor.innerHTML = bodyHtml || '<p><br></p>';
      document.getElementById('pageHeader').innerHTML = headerHtml || '';
      document.getElementById('pageFooter').innerHTML = footerHtml || '';
      ensureElementIds();
      suppressTracking = false;
      ensureAutomaticPageBreaks();
      notifySelectionState();
    }
  };

  // --- Implementations ---
  let elementIdCounter = 1;
  function ensureElementIds() {
    const blocks = editor.querySelectorAll('p, h1, h2, h3, h4, h5, h6, li, blockquote, td, th, div.text-box');
    blocks.forEach(el => {
      if (!el.getAttribute('data-remoffice-id')) {
        el.setAttribute('data-remoffice-id', 'remo_' + elementIdCounter++);
      }
    });
  }

  function getCurrentSelectionAnchor() {
    ensureElementIds();
    const sel = window.getSelection();
    if (!sel || sel.rangeCount === 0) return null;
    const range = sel.getRangeAt(0);
    let node = range.startContainer;
    let el = node.nodeType === 1 ? node : node.parentElement;
    while (el && el !== editor && !el.getAttribute('data-remoffice-id')) {
      el = el.parentElement;
    }
    if (!el || el === editor) {
      el = range.startContainer.parentElement;
    }
    const elementId = el ? (el.getAttribute('data-remoffice-id') || '') : '';
    return {
      elementId: elementId,
      startOffset: range.startOffset,
      endOffset: range.endOffset,
      quotedText: sel.toString().trim()
    };
  }

  function findElementByRemofficeId(id) {
    if (!id) return null;
    return editor.querySelector(`[data-remoffice-id="${id}"]`);
  }

  function highlightElementTemporarily(el) {
    if (!el) return;
    const origBg = el.style.backgroundColor;
    el.style.transition = 'background-color 0.5s';
    el.style.backgroundColor = '#FEF08A';
    setTimeout(() => { el.style.backgroundColor = origBg; }, 1500);
  }

  function scrollToAnchor(anchorJson) {
    let anchor = typeof anchorJson === 'string' ? JSON.parse(anchorJson) : anchorJson;
    if (!anchor || !anchor.elementId) return;
    const el = findElementByRemofficeId(anchor.elementId);
    if (el) {
      el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      highlightElementTemporarily(el);
    }
  }

  function selectAnchor(anchorJson) {
    let anchor = typeof anchorJson === 'string' ? JSON.parse(anchorJson) : anchorJson;
    if (!anchor || !anchor.elementId) return;
    const el = findElementByRemofficeId(anchor.elementId);
    if (el) {
      const sel = window.getSelection();
      const range = document.createRange();
      range.selectNodeContents(el);
      sel.removeAllRanges();
      sel.addRange(range);
    }
  }

  // --- Track Changes Implementation ---
  function setTrackChangesEnabled(enabled) {
    trackChangesEnabled = Boolean(enabled);
    ensureElementIds();
  }

  function acceptTrackedChange(id) {
    suppressTracking = true;
    const ins = editor.querySelector(`ins[data-remoffice-change-id="${id}"]`);
    if (ins) {
      const parent = ins.parentNode;
      while (ins.firstChild) parent.insertBefore(ins.firstChild, ins);
      parent.removeChild(ins);
    }
    const del = editor.querySelector(`del[data-remoffice-change-id="${id}"]`);
    if (del) {
      del.parentNode.removeChild(del);
    }
    suppressTracking = false;
    notifyContentChanged();
  }

  function rejectTrackedChange(id) {
    suppressTracking = true;
    const ins = editor.querySelector(`ins[data-remoffice-change-id="${id}"]`);
    if (ins) {
      ins.parentNode.removeChild(ins);
    }
    const del = editor.querySelector(`del[data-remoffice-change-id="${id}"]`);
    if (del) {
      const parent = del.parentNode;
      while (del.firstChild) parent.insertBefore(del.firstChild, del);
      parent.removeChild(del);
    }
    suppressTracking = false;
    notifyContentChanged();
  }

  function acceptAllTrackedChanges() {
    suppressTracking = true;
    const insList = editor.querySelectorAll('ins[data-remoffice-change-id]');
    insList.forEach(ins => {
      const parent = ins.parentNode;
      while (ins.firstChild) parent.insertBefore(ins.firstChild, ins);
      parent.removeChild(ins);
    });
    const delList = editor.querySelectorAll('del[data-remoffice-change-id]');
    delList.forEach(del => del.parentNode.removeChild(del));
    suppressTracking = false;
    notifyContentChanged();
  }

  function rejectAllTrackedChanges() {
    suppressTracking = true;
    const insList = editor.querySelectorAll('ins[data-remoffice-change-id]');
    insList.forEach(ins => ins.parentNode.removeChild(ins));
    const delList = editor.querySelectorAll('del[data-remoffice-change-id]');
    delList.forEach(del => {
      const parent = del.parentNode;
      while (del.firstChild) parent.insertBefore(del.firstChild, del);
      parent.removeChild(del);
    });
    suppressTracking = false;
    notifyContentChanged();
  }

  function goToNextTrackedChange() {
    const list = editor.querySelectorAll('ins[data-remoffice-change-id], del[data-remoffice-change-id]');
    if (list.length === 0) return;
    trackedChangeIndex = (trackedChangeIndex + 1) % list.length;
    const el = list[trackedChangeIndex];
    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    highlightElementTemporarily(el);
  }

  function goToPreviousTrackedChange() {
    const list = editor.querySelectorAll('ins[data-remoffice-change-id], del[data-remoffice-change-id]');
    if (list.length === 0) return;
    trackedChangeIndex = (trackedChangeIndex - 1 + list.length) % list.length;
    const el = list[trackedChangeIndex];
    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    highlightElementTemporarily(el);
  }

  // --- Comments Implementation ---
  function createCommentAnchor(commentId) {
    const sel = window.getSelection();
    let range = null;
    let text = '';
    if (sel && sel.rangeCount > 0 && sel.toString().trim().length > 0) {
      range = sel.getRangeAt(0);
      text = sel.toString().trim();
    } else if (lastValidSelectionRange) {
      range = lastValidSelectionRange;
      text = range.toString().trim();
    }
    if (!range || !text) return null;

    const anchor = getCurrentSelectionAnchor();
    const mark = document.createElement('mark');
    mark.setAttribute('data-remoffice-comment-id', commentId);
    mark.className = 'remoffice-comment-anchor';
    try {
      range.surroundContents(mark);
    } catch (e) {
      const frag = range.extractContents();
      mark.appendChild(frag);
      range.insertNode(mark);
    }
    lastValidSelectionRange = null;
    notifyContentChanged();
    const resultObj = {
      commentId: commentId,
      quote: text,
      anchor: anchor
    };
    if (window.AndroidBridge && window.AndroidBridge.onCommentAnchorCreated) {
      window.AndroidBridge.onCommentAnchorCreated(JSON.stringify(resultObj));
    }
    return resultObj;
  }

  function selectCommentAnchor(commentId) {
    const mark = editor.querySelector(`mark[data-remoffice-comment-id="${commentId}"]`);
    if (mark) {
      mark.scrollIntoView({ behavior: 'smooth', block: 'center' });
      const sel = window.getSelection();
      const range = document.createRange();
      range.selectNodeContents(mark);
      sel.removeAllRanges();
      sel.addRange(range);
    }
  }

  function removeCommentAnchor(commentId) {
    const mark = editor.querySelector(`mark[data-remoffice-comment-id="${commentId}"]`);
    if (mark) {
      const parent = mark.parentNode;
      while (mark.firstChild) parent.insertBefore(mark.firstChild, mark);
      parent.removeChild(mark);
      notifyContentChanged();
    }
  }

  function setCommentResolved(commentId, resolved) {
    const mark = editor.querySelector(`mark[data-remoffice-comment-id="${commentId}"]`);
    if (mark) {
      if (resolved) {
        mark.classList.add('resolved');
      } else {
        mark.classList.remove('resolved');
      }
      notifyContentChanged();
    }
  }

  // --- Styles Implementation ---
  function applyStyle(styleJson) {
    focusEditor();
    let style = typeof styleJson === 'string' ? JSON.parse(styleJson) : styleJson;
    if (!style || !style.name) return;
    const sel = window.getSelection();
    if (!sel || sel.rangeCount === 0) return;
    let node = sel.getRangeAt(0).startContainer;
    let block = node.nodeType === 1 ? node : node.parentElement;
    while (block && block !== editor && !['P', 'H1', 'H2', 'H3', 'H4', 'H5', 'H6', 'LI', 'BLOCKQUOTE'].includes(block.tagName)) {
      block = block.parentElement;
    }
    if (!block || block === editor) {
      block = document.createElement(style.htmlTag || 'p');
      block.innerHTML = sel.toString() || '<br>';
      editor.appendChild(block);
    } else if (style.htmlTag && block.tagName.toLowerCase() !== style.htmlTag.toLowerCase()) {
      const newBlock = document.createElement(style.htmlTag);
      newBlock.innerHTML = block.innerHTML;
      block.parentNode.replaceChild(newBlock, block);
      block = newBlock;
    }

    applyStyleToElement(block, style);
    notifyContentChanged();
  }

  function updateStyle(styleJson) {
    let style = typeof styleJson === 'string' ? JSON.parse(styleJson) : styleJson;
    if (!style || !style.name) return;
    const elements = editor.querySelectorAll(`[data-remoffice-style="${style.name}"]`);
    elements.forEach(el => applyStyleToElement(el, style));
    notifyContentChanged();
  }

  function applyStyleToElement(block, style) {
    block.setAttribute('data-remoffice-style', style.name);
    if (style.fontFamily) block.style.fontFamily = style.fontFamily;
    if (style.fontSizePt) block.style.fontSize = style.fontSizePt + 'pt';
    if (style.colorHex) block.style.color = style.colorHex;
    block.style.fontWeight = style.isBold ? 'bold' : 'normal';
    block.style.fontStyle = style.isItalic ? 'italic' : 'normal';
    block.style.textDecoration = style.isUnderline ? 'underline' : 'none';
    if (style.alignment) block.style.textAlign = style.alignment;
    if (style.dir) block.style.direction = style.dir;
    if (style.lineHeight) block.style.lineHeight = style.lineHeight;
    if (style.spaceBeforePt !== undefined && style.spaceBeforePt !== null) block.style.marginTop = style.spaceBeforePt + 'pt';
    if (style.spaceAfterPt !== undefined && style.spaceAfterPt !== null) block.style.marginBottom = style.spaceAfterPt + 'pt';
    if (style.indentMm !== undefined && style.indentMm !== null) block.style.marginInlineStart = style.indentMm + 'mm';
  }

  // --- Notes (Footnotes & Endnotes) Implementation ---
  function insertFootnote(noteJson) {
    focusEditor();
    let note = typeof noteJson === 'string' ? JSON.parse(noteJson) : noteJson;
    if (!note || !note.id) return;

    const fnSection = document.getElementById('remofficeFootnotes');
    if (fnSection) fnSection.style.display = 'block';

    const refId = 'fnref_' + note.id;
    const itemId = 'fn_' + note.id;

    const sup = document.createElement('sup');
    sup.id = refId;
    sup.setAttribute('data-remoffice-note-id', note.id);
    sup.setAttribute('data-remoffice-note-type', 'FOOTNOTE');
    sup.className = 'remoffice-note-reference';
    sup.innerHTML = `<a href="#${itemId}" onclick="window.editorApi.scrollToNote('${note.id}');return false;">${note.number || 1}</a>`;

    const sel = window.getSelection();
    if (sel && sel.rangeCount > 0) {
      const range = sel.getRangeAt(0);
      range.insertNode(sup);
    } else {
      editor.appendChild(sup);
    }

    if (fnSection) {
      const item = document.createElement('div');
      item.id = itemId;
      item.setAttribute('data-remoffice-note-item-id', note.id);
      item.className = 'remoffice-note-item';
      item.innerHTML = `<sup>${note.number || 1}</sup> ${note.text} <a href="#${refId}" onclick="window.editorApi.scrollToNoteReference('${note.id}');return false;">[↩]</a>`;
      fnSection.appendChild(item);
    }

    renumberNotes();
    notifyContentChanged();
  }

  function insertEndnote(noteJson) {
    focusEditor();
    let note = typeof noteJson === 'string' ? JSON.parse(noteJson) : noteJson;
    if (!note || !note.id) return;

    const enSection = document.getElementById('remofficeEndnotes');
    if (enSection) enSection.style.display = 'block';

    const refId = 'enref_' + note.id;
    const itemId = 'en_' + note.id;

    const sup = document.createElement('sup');
    sup.id = refId;
    sup.setAttribute('data-remoffice-note-id', note.id);
    sup.setAttribute('data-remoffice-note-type', 'ENDNOTE');
    sup.className = 'remoffice-note-reference';
    sup.innerHTML = `<a href="#${itemId}" onclick="window.editorApi.scrollToNote('${note.id}');return false;">${note.number || 1}</a>`;

    const sel = window.getSelection();
    if (sel && sel.rangeCount > 0) {
      const range = sel.getRangeAt(0);
      range.insertNode(sup);
    } else {
      editor.appendChild(sup);
    }

    if (enSection) {
      const item = document.createElement('div');
      item.id = itemId;
      item.setAttribute('data-remoffice-note-item-id', note.id);
      item.className = 'remoffice-note-item';
      item.innerHTML = `<sup>${note.number || 1}</sup> ${note.text} <a href="#${refId}" onclick="window.editorApi.scrollToNoteReference('${note.id}');return false;">[↩]</a>`;
      enSection.appendChild(item);
    }

    renumberNotes();
    notifyContentChanged();
  }

  function scrollToNote(noteId) {
    const item = document.querySelector(`[data-remoffice-note-item-id="${noteId}"]`);
    if (item) item.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  function scrollToNoteReference(noteId) {
    const ref = editor.querySelector(`sup[data-remoffice-note-id="${noteId}"]`);
    if (ref) ref.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  function deleteNote(noteId) {
    const ref = editor.querySelector(`sup[data-remoffice-note-id="${noteId}"]`);
    if (ref) ref.parentNode.removeChild(ref);
    const item = document.querySelector(`[data-remoffice-note-item-id="${noteId}"]`);
    if (item) item.parentNode.removeChild(item);
    renumberNotes();
    notifyContentChanged();
  }

  function renumberNotes() {
    const fnRefs = editor.querySelectorAll('sup[data-remoffice-note-type="FOOTNOTE"]');
    fnRefs.forEach((ref, idx) => {
      const num = idx + 1;
      const a = ref.querySelector('a');
      if (a) a.textContent = String(num);
      const noteId = ref.getAttribute('data-remoffice-note-id');
      const item = document.querySelector(`div[data-remoffice-note-item-id="${noteId}"]`);
      if (item && item.querySelector('sup')) {
        item.querySelector('sup').textContent = String(num);
      }
    });

    const enRefs = editor.querySelectorAll('sup[data-remoffice-note-type="ENDNOTE"]');
    enRefs.forEach((ref, idx) => {
      const num = idx + 1;
      const a = ref.querySelector('a');
      if (a) a.textContent = String(num);
      const noteId = ref.getAttribute('data-remoffice-note-id');
      const item = document.querySelector(`div[data-remoffice-note-item-id="${noteId}"]`);
      if (item && item.querySelector('sup')) {
        item.querySelector('sup').textContent = String(num);
      }
    });
  }

  // --- Bookmarks & Internal Links Implementation ---
  function addBookmark(bookmarkJson) {
    focusEditor();
    let bm = typeof bookmarkJson === 'string' ? JSON.parse(bookmarkJson) : bookmarkJson;
    if (!bm || !bm.id || !bm.name) return;

    const span = document.createElement('span');
    span.id = 'bm_' + bm.id;
    span.setAttribute('data-remoffice-bookmark-id', bm.id);
    span.setAttribute('data-remoffice-bookmark-name', bm.name);
    span.className = 'remoffice-bookmark';
    span.title = `Bookmark: ${bm.name}`;

    const sel = window.getSelection();
    if (sel && sel.rangeCount > 0) {
      const range = sel.getRangeAt(0);
      range.insertNode(span);
    } else {
      editor.appendChild(span);
    }
    notifyContentChanged();
  }

  function renameBookmark(id, newName) {
    const bm = editor.querySelector(`span[data-remoffice-bookmark-id="${id}"]`);
    if (bm) {
      bm.setAttribute('data-remoffice-bookmark-name', newName);
      bm.title = `Bookmark: ${newName}`;
      notifyContentChanged();
    }
  }

  function deleteBookmark(id) {
    const bm = editor.querySelector(`span[data-remoffice-bookmark-id="${id}"]`);
    if (bm) {
      bm.parentNode.removeChild(bm);
      notifyContentChanged();
    }
  }

  function goToBookmark(id) {
    const bm = editor.querySelector(`span[data-remoffice-bookmark-id="${id}"], #bm_${id}`);
    if (bm) {
      bm.scrollIntoView({ behavior: 'smooth', block: 'center' });
      bm.style.borderInlineStartWidth = '6px';
      setTimeout(() => { bm.style.borderInlineStartWidth = '3px'; }, 1500);
    }
  }

  function insertInternalLink(bookmarkId, text) {
    focusEditor();
    const link = document.createElement('a');
    link.href = `#bm_${bookmarkId}`;
    link.textContent = text || 'رابط العلامة المرجعية';
    link.onclick = function(e) {
      e.preventDefault();
      goToBookmark(bookmarkId);
      return false;
    };
    const sel = window.getSelection();
    if (sel && sel.rangeCount > 0) {
      const range = sel.getRangeAt(0);
      range.insertNode(link);
    } else {
      editor.appendChild(link);
    }
    notifyContentChanged();
  }

  // --- Table of Contents Implementation ---
  function insertTableOfContents() {
    removeTableOfContents();
    const headings = editor.querySelectorAll('h1, h2, h3, h4, h5, h6');
    if (headings.length === 0) return false;

    const tocBox = document.createElement('div');
    tocBox.id = 'remofficeTocBox';
    tocBox.className = 'remoffice-toc-box';
    tocBox.setAttribute('contenteditable', 'false');

    let html = '<h3 style="margin-top:0;color:#0F172A;">جدول المحتويات / Table of Contents</h3><ul style="list-style:none;padding-inline-start:0;margin:0;">';
    headings.forEach((h, idx) => {
      const hId = h.id || `heading_toc_${idx}`;
      h.id = hId;
      const level = parseInt(h.tagName.substring(1), 10);
      const indent = (level - 1) * 16;
      html += `<li style="margin-inline-start:${indent}px;margin-bottom:4px;"><a href="#${hId}" onclick="window.editorApi.goToHeading('${hId}');return false;" style="color:#1A56DB;text-decoration:none;">• ${h.textContent}</a></li>`;
    });
    html += '</ul>';
    tocBox.innerHTML = html;

    editor.insertBefore(tocBox, editor.firstChild);
    notifyContentChanged();
    return true;
  }

  function updateTableOfContents() {
    return insertTableOfContents();
  }

  function removeTableOfContents() {
    const box = editor.querySelector('#remofficeTocBox');
    if (box) box.parentNode.removeChild(box);
    notifyContentChanged();
  }

  function goToHeading(id) {
    const h = editor.querySelector(`#${id}`);
    if (h) h.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  setTimeout(notifySelectionState, 200);
})();
</script>
</body>
</html>
